services:
  mermaid:
    build:
      context: .
      dockerfile: Dockerfile
    stdin_open: true
    tty: true
    working_dir: /mermaid
    mem_limit: '8G'
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    env_file:
      - .env
    environment:
      # Keep pnpm store off the macOS bind mount (avoids ENFILE / file table overflow on Docker Desktop).
      npm_config_store_dir: /pnpm-store
    volumes:
      - ./:/mermaid:delegated
      - mermaid_node_modules:/mermaid/node_modules
      - mermaid_pnpm_store:/pnpm-store
      - root_cache:/root/.cache
      - root_local:/root/.local
      - root_npm:/root/.npm
      - /tmp:/tmp
    ports:
      - ${MERMAID_PORT}:${MERMAID_PORT}
      - 3333:3333
  cypress:
    image: cypress/included:14.0.3
    stdin_open: true
    tty: true
    working_dir: /mermaid
    mem_limit: '2G'
    entrypoint: cypress
    environment:
      - DISPLAY
    volumes:
      - ./:/mermaid:delegated
      - mermaid_node_modules:/mermaid/node_modules
      - /tmp/.X11-unix:/tmp/.X11-unix
    network_mode: host

volumes:
  root_cache:
  root_local:
  root_npm:
  mermaid_node_modules:
  mermaid_pnpm_store:
